---
- name: Install packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - wget
      - dpkg-dev
      - gcc
      - g++
      - libc6-dev
      - libssl-dev
      - make
      - git
      - cmake
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - pkg-config
      - unzip
      - rsync
      - clang
      - automake
      - autoconf
      - libtool
    state: present
    update_cache: true
