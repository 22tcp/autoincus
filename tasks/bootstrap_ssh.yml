---
- name: Check presence of .ssh/config
  ansible.builtin.stat:
    path: ~/.ssh/config
  register: bootstrap_ssh_stat_result

- name: Create the file, if it doesnt exist already
  ansible.builtin.file:
    path: ~/.ssh/config
    state: touch
    mode: '0640'
  when: not bootstrap_ssh_stat_result.stat.exists
  changed_when: true

- name: Add include line
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.ssh/config"
    line: "Include ansible-incus.conf"
    state: present
    create: true
    mode: '0600'

- name: Add file from template
  ansible.builtin.template:
    src: templates/boostrap-incus-ssh.j2
    dest: ~/.ssh/config/ansible-incus.conf
    mode: '0660'
    run_once: true
